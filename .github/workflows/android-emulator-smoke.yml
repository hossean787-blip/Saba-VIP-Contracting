name: Android Emulator - first-run and finance shell smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'integration_test/**'
      - 'pubspec.*'
      - 'tool/**'
      - '.github/workflows/android-emulator-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'integration_test/**'
      - 'pubspec.*'
      - 'tool/**'
      - '.github/workflows/android-emulator-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android, dependencies and licensed fonts
        run: bash tool/bootstrap_android.sh
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator and run actual device workflow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: flutter test integration_test/app_smoke_test.dart -d emulator-5554 --reporter expanded
