name: Android Release (commercial readiness candidate v1.0.0-rc.1)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run nine project specialist QA gates (offline, no AI API)
        run: python3 tool/specialist_checks.py --output dist/SPECIALIST_QA.json
      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android scaffold and Persian fonts
        run: bash tool/bootstrap_android.sh
      - name: Initialize Gradle from official CDN with retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if (cd android && ./gradlew --version); then
              echo "Gradle downloaded and initialized."
              exit 0
            fi
            echo "Gradle CDN transient failure; retry ${attempt}/4"
            sleep 8
          done
          echo "::error::Official Gradle CDN unavailable after retries"
          exit 1
      - name: Validate Dart source
        run: flutter analyze
      - name: Run Flutter unit tests
        run: flutter test
      - name: Test signing configuration patch
        run: python3 -m unittest discover -s tests_python -p 'test_*.py' -v
      - name: Install permanent private signing key
        env:
          SABA_RELEASE_KEYSTORE_B64: ${{ secrets.SABA_RELEASE_KEYSTORE_B64 }}
          SABA_RELEASE_STORE_PASSWORD: ${{ secrets.SABA_RELEASE_STORE_PASSWORD }}
        run: python3 tool/prepare_release_signing.py
      - name: Build stable-signed RELEASE APK
        env:
          SABA_RELEASE_STORE_PASSWORD: ${{ secrets.SABA_RELEASE_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((10000 + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          flutter build apk --release --build-name=1.0.0-rc.1 --build-number="$BUILD_NUMBER"
      - name: Verify signing identity, package ID, and APK checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="dist/Saba-VIP-Contracting-v1.0.0-rc.1-RELEASE.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/SIGNATURE_INFO.txt
          EXPECTED_SHA256="f98123b81276bd180d0a2f13d634801bec7ae2185400be560e4bf2f310041fee"
          ACTUAL_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p; s/^V2 Signer: certificate SHA-256 digest: //p' dist/SIGNATURE_INFO.txt | head -1 | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL_SHA256"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Release signer certificate mismatch. Refusing distribution."
            exit 1
          fi
          "$AAPT" dump badging "$APK" | grep '^package:' | tee dist/PACKAGE_INFO.txt
          grep -q "name='ir.saba.vip.saba_vip_contracting'" dist/PACKAGE_INFO.txt
          grep -q "versionCode='$BUILD_NUMBER'" dist/PACKAGE_INFO.txt
          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)
          {
            echo "BUILD_TYPE=release"
            echo "VERSION_NAME=1.0.0-rc.1"
            echo "VERSION_CODE=$BUILD_NUMBER"
            echo "PACKAGE_NAME=ir.saba.vip.saba_vip_contracting"
            echo "SIGNER_CERT_SHA256=$EXPECTED_SHA256"
            echo "SIGNING=permanent-key-from-GitHub-Secrets"
            echo "UPDATE_RULE=same-package-and-certificate-with-higher-versionCode"
            echo "CAUTION=pre-v0.2.1 APK used an unrelated temporary signing key"
            echo "CAUTION=backup-restore requires real-device test; do not use for irreplaceable data"
          } > dist/BUILD_INFO.txt
      - name: Confirm compiled Android privacy protections
        run: python3 tool/check_release_apk.py dist/Saba-VIP-Contracting-v1.0.0-rc.1-RELEASE.apk
      - name: Upload verified signed RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: Saba-VIP-Contracting-v1.0.0-rc.1-PERMANENT-SIGNED-RELEASE
          path: dist/
          if-no-files-found: error
          retention-days: 30
