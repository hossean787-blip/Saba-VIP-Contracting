name: Import source v0.2.0 and test APK
on:
  push:
    branches: [main]
    paths:
      - '.source/**'
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import audited source archive into main
        run: |
          set -euo pipefail
          if [[ ! -f lib/main.dart ]]; then
            unzip -oq .source/Saba-VIP-v0.2.0.zip -d .
            rm -f .source/Saba-VIP-v0.2.0.zip
            rmdir .source 2>/dev/null || true
            rm -f .github/workflows/import-source.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet || git commit -m "feat: import offline Flutter source v0.2.0 [source-import]"
            git push origin HEAD:main
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Android and validate
        run: |
          set -euo pipefail
          bash tool/bootstrap_android.sh
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Build alpha APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Saba-VIP-Contracting-v0.2.0-ALPHA
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
