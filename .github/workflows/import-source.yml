name: Android Release APK (test-signed)
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android scaffold and fonts
        run: bash tool/bootstrap_android.sh
      - name: Analyze Flutter code
        run: flutter analyze
      - name: Run Flutter unit tests
        run: flutter test
      - name: Build Android RELEASE (not debug)
        run: flutter build apk --release
      - name: Validate signature and generate hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Saba-VIP-Contracting-v0.2.0-RELEASE-test-signed.apk
          APK="dist/Saba-VIP-Contracting-v0.2.0-RELEASE-test-signed.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/SIGNATURE_INFO.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          {
            echo 'BUILD_VARIANT=release'
            echo 'APP_VERSION=0.2.0+2'
            echo 'SIGNING=temporary test signing from generated Flutter Android scaffold'
            echo 'NOTE=This is a real release-mode APK but NOT a production-signed release.'
            echo 'NOTE=Do not enter real company data. Secure backup/restore and on-device QA remain incomplete.'
            echo 'NOTE=Do not assume upgrade compatibility between distinct CI runs.'
          } > dist/RELEASE_NOTES.txt
      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: Saba-VIP-Contracting-v0.2.0-RELEASE-TEST-SIGNED
          path: dist/
          if-no-files-found: error
          retention-days: 30
