name: Android Alpha Build v0.2
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android scaffold and fonts
        run: bash tool/bootstrap_android.sh
      - name: Static analysis
        run: flutter analyze
      - name: Flutter unit tests
        run: flutter test
      - name: Build alpha APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Saba-VIP-Contracting-v0.2.0-ALPHA-TEST-SIGNED
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
