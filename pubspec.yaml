name: saba_vip_contracting
description: Offline VIP contracting manager (independent project).
publish_to: none
version: 0.6.0+7

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  persian_datetime_picker: ^3.1.0
  shamsi_date: ^1.1.1
  pdf: ^3.11.3
  excel: ^4.0.6
  share_plus: ^11.1.0
  cross_file: ^0.3.4+2
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/seed.sqlite
    - assets/fonts/NotoNaskhArabic.ttf
